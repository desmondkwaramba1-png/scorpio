<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCORPIO, Zimbabwe's Marketplace for Ebooks, Courses &amp; Templates</title>
  <meta name="description" content="Buy ebooks, guides, templates, and online courses from real Zimbabwean creators, pay instantly with EcoCash. Or open your own storefront on SCORPIO's digital marketplace in five minutes." />
  <meta property="og:site_name" content="SCORPIO" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SCORPIO, Zimbabwe's Marketplace for Ebooks, Courses & Templates" />
  <meta property="og:description" content="Buy ebooks, guides, templates, and online courses from real Zimbabwean creators, pay instantly with EcoCash. Or open your own storefront on SCORPIO's digital marketplace in five minutes." />
  <meta property="og:url" content="https://www.scorpio.co.zw/" />
  <link rel="canonical" href="https://www.scorpio.co.zw/" />
  <meta property="og:image" content="https://www.scorpio.co.zw/brand/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.scorpio.co.zw/brand/og-default.png" />
  <!-- /favicon.ico didn't exist as a real file — the SPA's catch-all
       rewrite was serving index.html itself for that URL, and Google's
       search-result favicon (and some older browsers/crawlers) check
       that exact conventional path directly, not just the <link> tags
       below. Real .ico now, generated from the current scorpion mark. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/brand/mark.svg">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#131921" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SCORPIO" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <!-- Real Lighthouse run measured these two as render-blocking for
       1000-1500ms combined (the single biggest cause of the slow FCP/LCP
       and a chunk of the CLS score, the page couldn't paint anything
       until they resolved). preload fetches them with real priority
       without blocking render; the stylesheet <link> then applies once
       loaded via the media="print" swap trick (the standard loadCSS
       pattern), and the noscript fallback covers a browser with
       JavaScript off, which never runs the swap. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Alex+Brush&display=swap">
  <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700,500&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Alex+Brush&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Alex+Brush&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700,500&display=swap" rel="stylesheet">
  </noscript>
  <!-- Static, not injected by useSEO — present on every response including
       to a crawler that never runs JS, and it's what helps Google tell
       this SCORPIO apart from the zodiac sign, the Mahindra, and every
       other "Scorpio" it already knows about: a real Organization entity,
       a Zimbabwean digital marketplace, at this exact domain. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "SCORPIO",
    "alternateName": "SCORPIO Marketplace",
    "url": "https://www.scorpio.co.zw/",
    "logo": "https://www.scorpio.co.zw/brand/icon-512.png",
    "description": "SCORPIO is Zimbabwe's digital marketplace for ebooks, guides, templates and online courses, with instant EcoCash payment.",
    "areaServed": { "@type": "Country", "name": "Zimbabwe" },
    "sameAs": []
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
