name: Subscription renewal sweep

# This app has no background job runner (see src/lib/escrow.js and
# src/lib/subscriptions.js's own comments) — everything else lazily
# reconciles state on the next relevant request. Sending reminder/lapse
# emails can't wait for a request the way state-only transitions can
# (nobody would ever trigger it), so this is the one genuinely
# externally-triggered piece: a daily cron hitting an ADMIN_KEY-gated
# endpoint that calls sendRenewalReminders(). Idempotent — reminder_sent_at
# and lapse_notice_sent_at mean re-running this same day is a no-op.
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger subscription sweep
        run: |
          curl -sS -X POST "${SCORPIO_API_URL}/api/admin/subscriptions/sweep" \
            -H "x-admin-key: ${SCORPIO_ADMIN_KEY}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        env:
          SCORPIO_API_URL: ${{ secrets.SCORPIO_API_URL }}
          SCORPIO_ADMIN_KEY: ${{ secrets.SCORPIO_ADMIN_KEY }}
