<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#1B2440"/>
      <stop offset="100%" stop-color="#0A0D16"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="22" fill="url(#bg)"/>

  <!-- Everything below was designed on a 100-wide canvas and centered
       there; this just re-centers the whole composition in the wider
       120-wide square (10px equal breathing room each side) rather than
       stretching or recomputing any of the artwork's own coordinates. -->
  <g transform="translate(10,0)">
    <!-- The scorpion mark, unchanged from mark.svg, just shifted down to
         leave real clearance above it for the cart it's carrying — the
         first attempt put the cart's wheels right where the tail's own
         upward curl already reaches, and the two merged into an unreadable
         blob. This gap (33px) is tuned to be just enough to read as two
         distinct shapes without the composition feeling like two icons
         with dead space between them. -->
    <g transform="translate(0,33)">
      <path d="M58 52 C 70 50, 76 40, 72 30 C 68 21, 56 17, 47 22"
            fill="none" stroke="#FF8C42" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M47 22 L 39 20 L 45 29 Z" fill="#FF8C42"/>
      <g fill="none" stroke="#FF8C42" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M44 50 C 32 46, 21 49, 17 59"/>
        <path d="M17 59 C 14 66, 18 70, 25 68"/>
      </g>
      <g fill="none" stroke="#FF8C42" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(100,0) scale(-1,1)">
        <path d="M44 50 C 32 46, 21 49, 17 59"/>
        <path d="M17 59 C 14 66, 18 70, 25 68"/>
      </g>
      <ellipse cx="50" cy="66" rx="11.5" ry="13.5" fill="#FF8C42"/>
      <circle cx="50" cy="50" r="7.5" fill="#FF8C42"/>
    </g>

    <!-- A simple shopping cart riding well clear above the scorpion's
         tail, same gold, same stroke weight and rounded joins so it reads
         as one mark, not two mismatched icons stuck together. -->
    <g fill="none" stroke="#FF8C42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 16 L24 16 L20 8"/>
      <path d="M34 16 L70 16 L64 34 L40 34 Z"/>
    </g>
    <circle cx="42" cy="41" r="4.5" fill="#FF8C42"/>
    <circle cx="62" cy="41" r="4.5" fill="#FF8C42"/>
  </g>
</svg>
