<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1B2440"/>
      <stop offset="100%" stop-color="#0A0D16"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed, no rounded corners — the OS applies its own mask shape
       (circle, squircle, rounded-square, whatever the launcher uses), so
       this must be a plain edge-to-edge square. All scorpion detail stays
       within ~32 units of center, well inside the ~40-unit safe-zone
       radius every maskable-icon spec asks for. -->
  <rect width="100" height="100" fill="url(#bg)"/>
  <path d="M58 52 C 70 50, 76 40, 72 30 C 68 21, 56 17, 47 22"
        fill="none" stroke="#D7F24B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M47 22 L 39 20 L 45 29 Z" fill="#D7F24B"/>
  <g fill="none" stroke="#D7F24B" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 50 C 32 46, 21 49, 17 59"/>
    <path d="M17 59 C 14 66, 18 70, 25 68"/>
  </g>
  <g fill="none" stroke="#D7F24B" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(100,0) scale(-1,1)">
    <path d="M44 50 C 32 46, 21 49, 17 59"/>
    <path d="M17 59 C 14 66, 18 70, 25 68"/>
  </g>
  <ellipse cx="50" cy="66" rx="11.5" ry="13.5" fill="#D7F24B"/>
  <circle cx="50" cy="50" r="7.5" fill="#D7F24B"/>
</svg>
