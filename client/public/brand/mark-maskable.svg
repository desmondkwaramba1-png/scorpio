<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141B3D"/>
      <stop offset="100%" stop-color="#070A1C"/>
    </radialGradient>
  </defs>
  <!-- Maskable variant: full-bleed square, no rounded corners — Android
       (and other platforms that support maskable icons) apply their own
       mask shape (circle, squircle, rounded square...) over the whole
       canvas, so this needs to stay filled edge-to-edge with no
       transparent/white gaps for that mask to reveal cleanly. The
       scorpion's existing bounding box (~x:13-40, y:21-48) already sits
       comfortably inside the required 80%-diameter safe zone centered on
       a 64x64 canvas, so the artwork itself is unchanged from mark.svg —
       only the background shape differs. -->
  <rect width="64" height="64" fill="url(#bg)"/>
  <g fill="none" stroke="#2DE1E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 44 Q17 30 27 26 Q40 21 40 33 Q40 42 32 42 Q27 42 27 37"/>
    <circle cx="27" cy="37" r="2.6" fill="#2DE1E6" stroke="none"/>
  </g>
  <g fill="none" stroke="#2DE1E6" stroke-width="3.4" stroke-linecap="round">
    <path d="M18 44 l-4 4"/>
    <path d="M18 44 l-5 1"/>
  </g>
</svg>
