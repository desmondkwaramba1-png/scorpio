# app name must be globally unique on Fly.io — `fly launch` will prompt you
# to change this if "scorpio-api" is already taken, or edit it here first.
app = "scorpio-api"
primary_region = "jnb"

[build]

[env]
  PORT = "4000"
  DATA_DIR = "/data"

# One machine only: SQLite on a single mounted volume can't be safely
# written to from more than one machine at once, so this app must never be
# scaled beyond 1 machine in 1 region.
[[mounts]]
  source = "scorpio_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  # Scale-to-zero (min_machines_running = 0) is wrong for a live app real
  # people sign up on and pay real EcoCash through — auto_start_machines
  # is supposed to wake a stopped machine on the next request, but in
  # practice this left the API sitting fully down until someone noticed
  # and manually started it again, with new signups stuck unable to reach
  # the server at all. Keeping one machine running at all times costs a
  # little more but means the app is actually there when someone needs it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512, not 256: a cover/avatar upload runs the image through sharp, and
  # 256MB was tight enough that a big upload under any concurrent load
  # could OOM-kill the machine (a ~10-15s restart, seen by whoever was
  # mid-request as "something went wrong"). Bumped after that risk was
  # flagged on launch day.
  memory = "512mb"
